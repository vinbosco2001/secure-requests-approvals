<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Admin - Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/admin}">Requests App - Admin</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/user}">Area User</a>
            <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="mb-3">
        <h3 class="mb-0">Gestione richieste</h3>
        <small class="text-muted">Aggiorna lo stato: PENDING / APPROVED / REJECTED.</small>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-header fw-semibold">Tutte le richieste</div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Tipo</th>
                        <th>Descrizione</th>
                        <th>Stato</th>
                        <th>Creato il</th>
                        <th>Azione</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="7" class="text-center py-4">Nessuna richiesta presente.</td>
                    </tr>
                    <tr th:each="r : ${requests}">
                        <td th:text="${r.id}">1</td>
                        <td th:text="${r.userId}">user</td>
                        <td th:text="${r.type}">TYPE</td>
                        <td th:text="${r.description}">desc</td>
                        <td th:text="${r.status}">PENDING</td>
                        <td th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">-</td>
                        <td>
                            <form th:action="@{'/admin/status/' + ${r.id}}" method="post" class="d-flex gap-2">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <select class="form-select form-select-sm" name="status">
                                    <option th:each="s : ${statuses}"
                                            th:value="${s.name()}"
                                            th:selected="${s.name() == r.status.name()}"
                                            th:text="${s.name()}"></option>
                                </select>
                                <button class="btn btn-sm btn-primary">Aggiorna</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
