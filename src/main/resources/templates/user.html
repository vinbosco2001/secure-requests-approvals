<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area User - Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/user}">Requests App</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/user/profile}">Profilo</a>
            <a class="btn btn-outline-warning btn-sm" th:if="${canViewAdminArea}" th:href="@{/admin}">Admin</a>
            <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="mb-3">
        <h3 class="mb-0">Ciao, <span th:text="${username}">user</span> 👋</h3>
        <small class="text-muted">Invia una richiesta e monitora lo stato (PENDING / APPROVED / REJECTED).</small>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header fw-semibold">Nuova richiesta</div>
        <div class="card-body">
            <form th:action="@{/user/request}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="col-md-4">
                    <label class="form-label">Tipo</label>
                    <select class="form-select" name="type" required>
                        <option value="" selected disabled>Seleziona...</option>
                        <option value="ACCESSO">Accesso</option>
                        <option value="PERMESSO">Permesso</option>
                        <option value="RIMBORSO">Rimborso</option>
                        <option value="ALTRO">Altro</option>
                    </select>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Descrizione</label>
                    <input class="form-control" name="description" placeholder="Descrivi la richiesta..." required/ maxlength="500">
                </div>

                <div class="col-12">
                    <button class="btn btn-primary">Invia richiesta</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header fw-semibold">Le mie richieste</div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Descrizione</th>
                        <th>Stato</th>
                        <th>Creato il</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(myRequests)}">
                        <td colspan="5" class="text-center py-4">Nessuna richiesta inviata.</td>
                    </tr>
                    <tr th:each="r : ${myRequests}">
                        <td th:text="${r.id}">1</td>
                        <td th:text="${r.type}">TYPE</td>
                        <td th:text="${r.description}">desc</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${r.status.name() == 'PENDING'} ? ' bg-warning text-dark' :
                                                  (${r.status.name() == 'APPROVED'} ? ' bg-success' : ' bg-danger')"
                                  th:text="${r.status}">
                            </span>
                        </td>
                        <td th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
