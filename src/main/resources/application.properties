# ==========================================
# CONFIGURAZIONE GENERALE APP
# ==========================================
server.port=8081
spring.application.name=requests-app
server.forward-headers-strategy=native

# ==========================================
# CONFIGURAZIONE VAULT
# ==========================================
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.authentication=token
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.application-name=requests-app

# Il token viene passato come variabile d'ambiente o parametro all'avvio
spring.cloud.vault.token=${VAULT_TOKEN}

spring.config.import=vault://

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/requests_db
spring.datasource.driver-class-name=org.postgresql.Driver
# Username e Password vengono iniettati da Vault
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# KEYCLOAK OIDC (Login & Identit)
# ==========================================
spring.security.oauth2.client.registration.keycloak.client-id=requests-app
spring.security.oauth2.client.registration.keycloak.client-secret=${keycloak_client_secret}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.keycloak.issuer-uri=https://auth.local/realms/requests-approvals
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# ==========================================
# KEYCLOAK AUTHORIZATION CLIENT (PDP CONFIG)
# Serve alla classe KeycloakPdpService per chiedere i permessi
# ==========================================
# URL base del server (senza /realms/...)
keycloak.auth-server-url=https://auth.local

# Il nome del realm
keycloak.realm=requests-approvals

# Il Client ID che agisce da Resource Server (deve coincidere con quello sopra)
keycloak.resource=requests-app

# Il Secret (riutilizziamo quello che Vault inietta per OIDC)
keycloak.credentials.secret=${keycloak_client_secret}

# ==========================================
# SICUREZZA SESSIONI & COOKIE
# ==========================================
# Impedisce a JavaScript di leggere il cookie (Protezione contro furto via XSS)
server.servlet.session.cookie.http-only=true
# Forza il cookie a viaggiare solo su HTTPS (Protezione contro Sniffing)
server.servlet.session.cookie.secure=true
# Protegge contro attacchi CSRF impedendo l'invio del cookie da siti terzi
server.servlet.session.cookie.same-site=lax

# ==========================================
# LOGGING
# ==========================================
logging.file.name=logs/application.log
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=WARN
logging.level.org.springframework.web=WARN

# 1. Per vedere Spring che recupera le info utente (Login/UserInfo)
logging.level.org.springframework.security.web.authentication=WARN

# 2. Per vedere la richiesta di permesso (PEP -> PDP) e la risposta
logging.level.org.keycloak.authorization.client=WARN

# 3. (OPZIONALE - "X-RAY MODE") Per vedere il JSON esatto inviato via rete
# Attivalo solo se vuoi vedere proprio il body della richiesta HTTP
logging.level.org.apache.http.wire=OFF

# ==========================================
# HIKARICP (CONNECTION POOL) - ANTI DB EXHAUSTION
# ==========================================
# Limita il numero massimo di connessioni che l'app può aprire verso PostgreSQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Evita thread bloccati troppo a lungo quando il DB è sotto stress
spring.datasource.hikari.connection-timeout=3000

# Gestione connessioni inattive / rotazione connessioni
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Diagnostica perdite connessioni (utile per individuare pool exhaustion)
spring.datasource.hikari.leak-detection-threshold=20000